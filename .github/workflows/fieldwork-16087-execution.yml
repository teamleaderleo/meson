name: Fieldwork Meson 16087 execution

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'fieldwork/16087-bfd-rpath-link'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: fieldwork/16087-bfd-rpath-link
          path: candidate
          fetch-depth: 0

      - name: Check out default branch for retirement
        uses: actions/checkout@v4
        with:
          ref: master
          path: default
          fetch-depth: 0

      - name: Prove regression and build patch
        shell: bash
        run: |
          set -euo pipefail
          cd candidate

          expected_base=cb59331b47aa1e502d5b49d92e7c75bdf7829e61
          test "$(git rev-parse HEAD)" = "$expected_base"

          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com

          python3 - <<'PY'
          from pathlib import Path

          path = Path('unittests/internaltests.py')
          text = path.read_text()
          marker = '    def test_compiler_args_class_gnuld(self):\n'
          test = (
              "    def test_gnuld_rpath_link_modern_bfd(self):\n"
              "        env = get_fake_env()\n"
              "        linker = linkers.GnuBFDDynamicLinker(\n"
              "            [], env, MachineChoice.HOST,\n"
              "            ManyInOneLinkerOptionStyle('-Wl,', ','), [])\n"
              "        linker.version = '2.40'\n"
              "        target = mock.Mock()\n"
              "        target.determine_rpath_dirs.return_value = ['lib']\n"
              "        target.install_rpath = ''\n"
              "        target.build_rpath = ''\n"
              "        args, _ = linker.build_rpath_args('/build', 'app', target)\n"
              "        self.assertIn('-Wl,-rpath-link,/build/lib', args)\n"
              "\n"
          )
          if text.count(marker) != 1:
              raise SystemExit('unexpected InternalTests source')
          path.write_text(text.replace(marker, test + marker, 1))
          PY

          git add unittests/internaltests.py
          git commit -m "tests: cover modern ld.bfd rpath-link"
          test_sha=$(git rev-parse HEAD)

          set +e
          python3 run_unittests.py InternalTests.test_gnuld_rpath_link_modern_bfd > /tmp/red.txt 2>&1
          red_status=$?
          set -e
          cat /tmp/red.txt
          test "$red_status" -ne 0
          grep -q 'test_gnuld_rpath_link_modern_bfd' /tmp/red.txt
          grep -q -- '-Wl,-rpath-link,/build/lib' /tmp/red.txt

          python3 - <<'PY'
          from pathlib import Path

          path = Path('mesonbuild/linkers/linkers.py')
          text = path.read_text()
          old_comment1 = (
              "        # written to the binary. Needed only with GNU ld, and only for\n"
              "        # versions before 2.28:\n"
          )
          new_comment1 = (
              "        # written to the binary. Needed with GNU ld.bfd. GNU gold only\n"
              "        # needs this for versions before 2.28:\n"
          )
          old_comment2 = (
              "        # In 2.28 and on, $ORIGIN tokens inside of -rpath are respected,\n"
              "        # so we do not need to duplicate it in -rpath-link.\n"
          )
          new_comment2 = (
              "        # Modern ld.bfd respects $ORIGIN inside of -rpath, but expands it\n"
              "        # relative to the DSO carrying DT_NEEDED. That can differ from the\n"
              "        # output directory, so keep the absolute -rpath-link as well.\n"
          )
          old_cond = "        if self.id in {'ld.bfd', 'ld.gold'} and mesonlib.version_compare(self.version, '<2.28'):\n"
          new_cond = "        if self.id == 'ld.bfd' or (self.id == 'ld.gold' and mesonlib.version_compare(self.version, '<2.28')):\n"
          if text.count(old_comment1) != 1 or text.count(old_comment2) != 1 or text.count(old_cond) != 1:
              raise SystemExit('unexpected GNU rpath-link source')
          text = text.replace(old_comment1, new_comment1, 1)
          text = text.replace(old_comment2, new_comment2, 1)
          text = text.replace(old_cond, new_cond, 1)
          path.write_text(text)
          PY

          git add mesonbuild/linkers/linkers.py
          git commit -m "linkers: keep rpath-link for modern ld.bfd"
          fix_sha=$(git rev-parse HEAD)

          python3 run_unittests.py InternalTests.test_gnuld_rpath_link_modern_bfd > /tmp/green.txt 2>&1
          cat /tmp/green.txt
          python3 run_unittests.py InternalTests > /tmp/suite.txt 2>&1
          tail -n 40 /tmp/suite.txt
          python3 -m compileall -q mesonbuild/linkers/linkers.py unittests/internaltests.py
          git diff --check "$expected_base"..HEAD

          {
            echo '## Fieldwork Meson 16087 execution'
            echo
            echo "- Exact upstream base: \`$expected_base\`"
            echo "- Test-only commit: \`$test_sha\`"
            echo "- Fix commit: \`$fix_sha\`"
            echo '- Red control: focused regression failed on the missing modern ld.bfd rpath-link argument.'
            echo '- Green control: focused regression passed after the source edit.'
            echo '- InternalTests suite: passed.'
            echo '- compileall: passed.'
            echo '- git diff --check: passed.'
          } >> "$GITHUB_STEP_SUMMARY"

          git push --force-with-lease origin HEAD:fieldwork/16087-bfd-rpath-link

      - name: Retire carrier workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd default
          if test -f .github/workflows/fieldwork-16087-execution.yml; then
            git config user.name fieldwork-bot
            git config user.email fieldwork-bot@users.noreply.github.com
            git rm .github/workflows/fieldwork-16087-execution.yml
            git commit -m "Retire Meson 16087 execution carrier"
            git push origin HEAD:master
          fi
