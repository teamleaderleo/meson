name: Fieldwork Meson 16046 apply and verify

on:
  push:
    branches:
      - fieldwork/16046-source-option-dependency
    paths:
      - .github/workflows/fieldwork-16046-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fieldwork/16046/results
          python3 meson.py introspect --dependencies \
            fieldwork/16046/reproducer/meson.build \
            > fieldwork/16046/results/baseline.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('fieldwork/16046/results/baseline.json').read_text())
          assert len(data) == 1, data
          assert data[0]['name'] == 'unknown', data
          PY

      - name: Apply bounded source change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mesonbuild/ast/introspection.py')
          text = path.read_text()

          old_mapping = """            'dependency': self.func_dependency,\n            'executable': self.func_executable,"""
          new_mapping = """            'dependency': self.func_dependency,\n            'get_option': self.func_get_option,\n            'executable': self.func_executable,"""
          if text.count(old_mapping) != 1:
              raise SystemExit('unexpected dependency mapping shape')
          text = text.replace(old_mapping, new_mapping, 1)

          marker = "\n    def func_project(self, node: BaseNode, args: T.List[TYPE_var], kwargs: T.Dict[str, TYPE_var]) -> None:\n"
          method = """
    def func_get_option(self, node: BaseNode,
                        args: T.List[TYPE_var],
                        kwargs: T.Dict[str, TYPE_var]) -> TYPE_var:
        args = self.flatten_args(args)
        if len(args) != 1 or not isinstance(args[0], str):
            return UnknownValue()

        key = OptionKey.from_string(args[0]).evolve(subproject=self.subproject)
        try:
            value = self.coredata.optstore.get_value_for(key)
        except KeyError:
            return UnknownValue()

        # Source introspection can safely expose ordinary option primitives.
        # Keep feature wrappers and future structured values unresolved until
        # the AST interpreter supports their method semantics.
        if isinstance(value, (str, bool, int)):
            return value
        if isinstance(value, list) and all(isinstance(item, (str, bool, int)) for item in value):
            return value
        return UnknownValue()
"""
          if text.count(marker) != 1:
              raise SystemExit('unexpected func_project shape')
          text = text.replace(marker, '\n' + method + marker, 1)
          path.write_text(text)
          PY

      - name: Verify candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q mesonbuild
          python3 meson.py introspect --dependencies \
            fieldwork/16046/reproducer/meson.build \
            > fieldwork/16046/results/candidate.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('fieldwork/16046/results/candidate.json').read_text())
          assert data == [{
              'name': 'systemd',
              'required': False,
              'version': ['>= 209'],
              'has_fallback': False,
              'conditional': False,
          }], data
          PY
          git diff --check

      - name: Record receipt, retire carrier, and publish tested source
        shell: bash
        run: |
          set -euo pipefail
          cat > fieldwork/16046/receipt.md <<EOF
          # Meson 16046 execution receipt

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Starting head: ${GITHUB_SHA}
          - Runner: ubuntu-latest
          - Baseline: source introspection emitted one dependency named \`unknown\`.
          - Candidate: source introspection emitted \`systemd\` with the expected version and flags.
          - Gates: focused baseline assertion, focused candidate assertion, \`python3 -m compileall -q mesonbuild\`, and \`git diff --check\`.
          - Evidence class: target-executed focused path; not a full Meson gate.
          - Upstream contact: unauthorized and absent.
          EOF
          rm .github/workflows/fieldwork-16046-apply.yml
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add mesonbuild/ast/introspection.py fieldwork/16046 .github/workflows/fieldwork-16046-apply.yml
          git commit -m "Fix source introspection option dependencies [fieldwork applied]"
          git push origin HEAD:fieldwork/16046-source-option-dependency
