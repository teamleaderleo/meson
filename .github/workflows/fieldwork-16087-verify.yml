name: Fieldwork Meson 16087 verify

on:
  push:
    branches: [fieldwork/16087-trigger]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: fieldwork/16087-bfd-rpath-link
          path: candidate
          fetch-depth: 0

      - name: Check out default branch for retirement
        uses: actions/checkout@v4
        with:
          ref: master
          path: default
          fetch-depth: 0

      - name: Prove test-only commit is red
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          expected_test=7d1b961786eb94fd5e8d5aa3aee68235b3459a25
          test "$(git rev-parse HEAD)" = "$expected_test"
          set +e
          python3 run_unittests.py LinkerTests.test_gnuld_rpath_link_modern_bfd > /tmp/red.txt 2>&1
          status=$?
          set -e
          cat /tmp/red.txt
          test "$status" -ne 0
          grep -Fq -- '-Wl,-rpath-link,/build/lib' /tmp/red.txt
          grep -Fq 'AssertionError' /tmp/red.txt

      - name: Apply narrow ld.bfd fix
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mesonbuild/linkers/linkers.py')
          text = path.read_text()
          old_comment1 = (
              '        # written to the binary. Needed only with GNU ld, and only for\n'
              '        # versions before 2.28:\n'
          )
          new_comment1 = (
              '        # written to the binary. Needed with GNU ld.bfd. GNU gold only\n'
              '        # needs this for versions before 2.28:\n'
          )
          old_comment2 = (
              '        # In 2.28 and on, $ORIGIN tokens inside of -rpath are respected,\n'
              '        # so we do not need to duplicate it in -rpath-link.\n'
          )
          new_comment2 = (
              '        # Modern ld.bfd respects $ORIGIN inside of -rpath, but expands it\n'
              '        # relative to the DSO carrying DT_NEEDED. That can differ from the\n'
              '        # output directory, so keep the absolute -rpath-link as well.\n'
          )
          old_cond = "        if self.id in {'ld.bfd', 'ld.gold'} and mesonlib.version_compare(self.version, '<2.28'):\n"
          new_cond = "        if self.id == 'ld.bfd' or (self.id == 'ld.gold' and mesonlib.version_compare(self.version, '<2.28')):\n"
          for needle in (old_comment1, old_comment2, old_cond):
              if text.count(needle) != 1:
                  raise SystemExit(f'unexpected source occurrence count for {needle!r}')
          text = text.replace(old_comment1, new_comment1, 1)
          text = text.replace(old_comment2, new_comment2, 1)
          text = text.replace(old_cond, new_cond, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Prove fixed commit is green
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          python3 run_unittests.py LinkerTests.test_gnuld_rpath_link_modern_bfd
          python3 run_unittests.py InternalTests.test_compiler_args_class_gnuld
          python3 -m compileall -q mesonbuild/linkers/linkers.py unittests/linkerstests.py
          git diff --check

      - name: Commit and publish fix
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add mesonbuild/linkers/linkers.py
          git commit -m "linkers: keep rpath-link for modern ld.bfd"
          fix_sha=$(git rev-parse HEAD)
          echo "Fix commit: $fix_sha" >> "$GITHUB_STEP_SUMMARY"
          git push origin HEAD:fieldwork/16087-bfd-rpath-link

      - name: Retire carrier workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd default
          if test -f .github/workflows/fieldwork-16087-verify.yml; then
            git config user.name fieldwork-bot
            git config user.email fieldwork-bot@users.noreply.github.com
            git rm .github/workflows/fieldwork-16087-verify.yml
            git commit -m "Retire Meson 16087 verifier"
            git push origin HEAD:master
          fi
