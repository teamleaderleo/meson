name: Fieldwork Meson 16046 base-versus-candidate verification

on:
  push:
    branches:
      - fieldwork/16046-source-option-dependency
    paths:
      - .github/workflows/fieldwork-16046-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare exact base and candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fieldwork/16046/results
          git worktree add --detach "$RUNNER_TEMP/meson-base" \
            0b5b32e284709eb5b23ed30207fe978362d30a3d

          python3 "$RUNNER_TEMP/meson-base/meson.py" introspect --dependencies \
            "$GITHUB_WORKSPACE/fieldwork/16046/reproducer/meson.build" \
            > fieldwork/16046/results/baseline.json
          python3 meson.py introspect --dependencies \
            fieldwork/16046/reproducer/meson.build \
            > fieldwork/16046/results/candidate.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('fieldwork/16046/results/baseline.json').read_text())
          candidate = json.loads(Path('fieldwork/16046/results/candidate.json').read_text())
          assert len(baseline) == 1 and baseline[0]['name'] == 'unknown', baseline
          assert candidate == [{
              'name': 'systemd',
              'required': False,
              'version': ['>= 209'],
              'has_fallback': False,
              'conditional': False,
          }], candidate
          PY

          python3 -m compileall -q mesonbuild
          git diff --check

      - name: Record receipt and retire carrier
        shell: bash
        run: |
          set -euo pipefail
          cat > fieldwork/16046/receipt.md <<EOF
          # Meson 16046 execution receipt

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Candidate head under test: ${GITHUB_SHA}
          - Exact comparison base: \`0b5b32e284709eb5b23ed30207fe978362d30a3d\`
          - Runner: ubuntu-latest
          - Base result: source introspection emitted one dependency named \`unknown\`.
          - Candidate result: source introspection emitted \`systemd\` with the expected version and flags.
          - Gates: exact-base/candidate focused assertions, \`python3 -m compileall -q mesonbuild\`, and \`git diff --check\`.
          - Evidence class: target-executed focused source-introspection path; not a full Meson gate.
          - Upstream contact: unauthorized and absent.
          EOF
          rm .github/workflows/fieldwork-16046-verify.yml
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add fieldwork/16046 .github/workflows/fieldwork-16046-verify.yml
          git commit -m "Record Meson source-introspection verification [fieldwork executed]"
          git push origin HEAD:fieldwork/16046-source-option-dependency
