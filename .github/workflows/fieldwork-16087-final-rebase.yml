name: Fieldwork Meson ld.bfd final verify

on:
  push:
    branches:
      - fieldwork/16087-final-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the exact rebased candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=ed3d0bcccfb713e369ee4fddb95da23e825b72b1
          upstream=be6841aab8318b61b620c6c9375137570a01b89d
          test "$(git rev-parse HEAD^)" = "$candidate"
          git checkout --detach "$candidate"
          test "$(git rev-parse HEAD^)" = "$upstream"
          git diff --check "$upstream" "$candidate"

          python3 run_unittests.py LinkerTests.test_gnuld_rpath_link_version_gate
          python3 run_unittests.py BfdLinkerTests.test_rpath_link_transitive_dependency | tee /tmp/integration.txt
          ! grep -Fq 'skipped=' /tmp/integration.txt
          python3 run_unittests.py InternalTests.test_compiler_args_class_gnuld
          python3 -m compileall -q mesonbuild/linkers/linkers.py unittests/linkertests.py
          git diff --check "$upstream" "$candidate"
