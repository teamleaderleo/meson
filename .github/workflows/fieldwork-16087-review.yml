name: Fieldwork Meson ld.bfd review verify

on:
  push:
    branches:
      - fieldwork/16087-review-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove tests fail before the fix
        shell: bash
        run: |
          set -euo pipefail

          set +e
          python3 run_unittests.py LinkerTests.test_gnuld_rpath_link_version_gate > /tmp/red-unit.txt 2>&1
          unit_status=$?
          set -e
          cat /tmp/red-unit.txt
          test "$unit_status" -ne 0
          grep -Fq -- '-rpath-link' /tmp/red-unit.txt

          set +e
          python3 run_unittests.py BfdLinkerTests.test_rpath_link_transitive_dependency > /tmp/red-integration.txt 2>&1
          integration_status=$?
          set -e
          cat /tmp/red-integration.txt
          test "$integration_status" -ne 0
          grep -Fq 'a_good' /tmp/red-integration.txt

      - name: Apply candidate source change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mesonbuild/linkers/linkers.py')
          text = path.read_text()
          old_comment1 = (
              '        # written to the binary. Needed only with GNU ld, and only for\n'
              '        # versions before 2.28:\n'
          )
          new_comment1 = (
              '        # written to the binary. Needed with GNU ld.bfd. GNU gold only\n'
              '        # needs this for versions before 2.28:\n'
          )
          old_comment2 = (
              '        # In 2.28 and on, $ORIGIN tokens inside of -rpath are respected,\n'
              '        # so we do not need to duplicate it in -rpath-link.\n'
          )
          new_comment2 = (
              '        # Modern ld.bfd respects $ORIGIN inside of -rpath, but expands it\n'
              '        # relative to the DSO carrying DT_NEEDED. That can differ from the\n'
              '        # output directory, so keep the absolute -rpath-link as well.\n'
          )
          old_cond = "        if self.id in {'ld.bfd', 'ld.gold'} and mesonlib.version_compare(self.version, '<2.28'):\n"
          new_cond = "        if self.id == 'ld.bfd' or (self.id == 'ld.gold' and mesonlib.version_compare(self.version, '<2.28')):\n"
          for needle in (old_comment1, old_comment2, old_cond):
              if text.count(needle) != 1:
                  raise SystemExit(f'unexpected source occurrence count for {needle!r}')
          text = text.replace(old_comment1, new_comment1, 1)
          text = text.replace(old_comment2, new_comment2, 1)
          text = text.replace(old_cond, new_cond, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Prove tests pass after the fix
        shell: bash
        run: |
          set -euo pipefail
          python3 run_unittests.py LinkerTests.test_gnuld_rpath_link_version_gate
          python3 run_unittests.py BfdLinkerTests.test_rpath_link_transitive_dependency | tee /tmp/green-integration.txt
          ! grep -Fq 'skipped=' /tmp/green-integration.txt
          python3 run_unittests.py InternalTests.test_compiler_args_class_gnuld
          python3 -m compileall -q mesonbuild/linkers/linkers.py unittests/linkertests.py
          git diff --check
