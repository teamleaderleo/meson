name: Fieldwork Meson 15998 execution

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'execution/15998-cmake-cuda-std'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out canonical candidate
        uses: actions/checkout@v4
        with:
          ref: fieldwork/15998-cmake-cuda-std
          path: candidate
          fetch-depth: 0

      - name: Check out default branch for retirement
        uses: actions/checkout@v4
        with:
          ref: master
          path: default
          fetch-depth: 0

      - name: Execute base and candidate controls
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          mkdir -p fieldwork/15998/results

          set +e
          python3 run_unittests.py CMakeInterpreterTests.test_cuda_standard_is_normalized_as_cuda_override \
            > fieldwork/15998/results/before.txt 2>&1
          before_status=$?
          set -e
          test "$before_status" -ne 0
          grep -q 'test_cuda_standard_is_normalized_as_cuda_override' fieldwork/15998/results/before.txt

          python3 - <<'PY'
          from pathlib import Path
          path = Path('mesonbuild/cmake/interpreter.py')
          text = path.read_text()
          old_comment = '        # Detect setting the C and C++ standard and do additional compiler args manipulation'
          new_comment = '        # Detect setting the C, C++ and CUDA standard and do additional compiler args manipulation'
          old_loop = "        for i in T.cast('T.Tuple[Language, ...]', ('c', 'cpp')):"
          new_loop = "        for i in T.cast('T.Tuple[Language, ...]', ('c', 'cpp', 'cuda')):"
          if text.count(old_comment) != 1 or text.count(old_loop) != 1:
              raise SystemExit('unexpected CMake standard-normalization source')
          text = text.replace(old_comment, new_comment, 1).replace(old_loop, new_loop, 1)
          path.write_text(text)
          PY

          python3 run_unittests.py CMakeInterpreterTests.test_cuda_standard_is_normalized_as_cuda_override \
            > fieldwork/15998/results/after.txt 2>&1
          python3 -m compileall -q mesonbuild/cmake/interpreter.py unittests/cmakeinterpretertests.py
          git diff --check

          cat > fieldwork/15998/receipt.md <<EOF
          # Meson 15998 execution receipt

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Starting packet head: $(git rev-parse HEAD)
          - Before source edit: focused synthetic CUDA standard regression failed as expected.
          - After source edit: focused regression passed.
          - Python compileall and git diff --check passed.
          - Runner: Ubuntu 24.04.
          - Evidence class: compiler-free target-executed source classification and deduplication.
          - Precedence among CMake-discovered standards, project cuda_std, and explicit subproject overrides remains unproven.
          - External contact: none; unauthorized.
          EOF

          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add mesonbuild/cmake/interpreter.py unittests/cmakeinterpretertests.py fieldwork/15998
          git commit -m "Normalize CMake CUDA standard flags"
          git push origin HEAD:fieldwork/15998-cmake-cuda-std

      - name: Retire carrier workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd default
          if test -f .github/workflows/fieldwork-15998-execution.yml; then
            git config user.name fieldwork-bot
            git config user.email fieldwork-bot@users.noreply.github.com
            git rm .github/workflows/fieldwork-15998-execution.yml
            git commit -m "Retire Meson 15998 execution carrier"
            git push origin HEAD:master
          fi
